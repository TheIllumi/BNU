<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Exam Study Tracker — Computer Networks</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<!-- Inline icon sprite (minimal line icons, no external libraries, works offline) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2.2-2.5 3.7M12 17h.01"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-7 0-3-2-5.5-3.5-7C15 10 14 11 12.5 11 11 11 10 9.5 10 7.5c0-1.8.8-3.4 1.5-4.5C7.5 4.5 5 8.5 5 13c0 5.3 3 9 7 9z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></symbol>
    <symbol id="i-glossary" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3H3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 1-1c5 0 6.5 2 11 2 1.5 0 2.5-.2 3-.4V14c-.5.2-1.5.4-3 .4-4.5 0-6-2-11-2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
    <div class="brand">
      <div class="brand-mark">CN</div>
      <div class="brand-text">
        <h1>Final Exam Study Tracker</h1>
        <p>Study smarter, track your progress, revise faster, and complete every topic before the exam.</p>
      </div>
    </div>
    <div class="topbar-tools">
      <div class="searchbox">
        <svg><use href="#i-search"/></svg>
        <input type="search" id="globalSearch" placeholder="Search topics, questions, definitions..." autocomplete="off">
      </div>
      <button class="iconbtn" id="themeToggle" aria-label="Switch theme" title="Switch between light and dark theme">
        <svg class="ic-sun"><use href="#i-sun"/></svg>
        <svg class="ic-moon"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <!-- ============ SIDEBAR ============ -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-group">
        <button class="nav-link active" data-view="dashboard"><svg><use href="#i-grid"/></svg>Dashboard</button>
        <button class="nav-link" data-view="study"><svg><use href="#i-book"/></svg>Study Guide</button>
        <button class="nav-link" data-view="theory"><svg><use href="#i-bulb"/></svg>Theory Prep <span class="nav-pill">30%</span></button>
        <button class="nav-link" data-view="numerical"><svg><use href="#i-calc"/></svg>Numerical Practice <span class="nav-pill strong">70%</span></button>
        <button class="nav-link" data-view="questions"><svg><use href="#i-help"/></svg>Question Bank</button>
        <button class="nav-link" data-view="revision"><svg><use href="#i-flame"/></svg>Revision Mode</button>
        <button class="nav-link" data-view="glossary"><svg><use href="#i-glossary"/></svg>Glossary</button>
        <button class="nav-link" data-view="notes"><svg><use href="#i-note"/></svg>My Notes</button>
      </div>

      <div class="nav-section-label">Lectures</div>
      <div class="nav-group" id="lectureNav"><!-- filled by JS --></div>

      <div class="sidebar-timer card">
        <div class="timer-head"><svg><use href="#i-timer"/></svg><span>Focus Timer</span></div>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-actions">
          <button class="btn tiny" id="timerStart"><svg><use href="#i-play"/></svg>Start</button>
          <button class="btn tiny ghost" id="timerPause"><svg><use href="#i-pause"/></svg>Pause</button>
          <button class="btn tiny ghost" id="timerReset"><svg><use href="#i-reset"/></svg>Reset</button>
        </div>
      </div>

      <div class="sidebar-data">
        <button class="btn tiny ghost" id="exportBtn"><svg><use href="#i-download"/></svg>Export progress</button>
        <button class="btn tiny ghost" id="importBtn"><svg><use href="#i-upload"/></svg>Import progress</button>
        <button class="btn tiny danger" id="resetAllBtn"><svg><use href="#i-trash"/></svg>Reset all progress</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </nav>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ MAIN ============ -->
    <main class="main" id="mainView"><!-- filled by JS --></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
